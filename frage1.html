<!DOCTYPE html>
<html>
<head>
    <title>Survey Question</title>
    <style>
        /* Add basic styles for the form and progress bar */
        body { font-family: Arial, sans-serif; }
        .progress-bar { width: 100%; background-color: #f3f3f3; }
        .progress { height: 20px; background-color: #4caf50; width: 30%; }
        .form-container { max-width: 600px; margin: auto; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        input[type="text"], input[type="email"] { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; }
        button[type="submit"] { background-color: #4caf50; color: white; }
        button[type="button"] { background-color: #f44336; color: white; }
    </style>
</head>
<body>
    <div class="progress-bar"><div class="progress"></div></div>
    <div class="form-container">
        <h2>Survey Question</h2>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="experience">Experience Level:</label>
            <select id="experience" name="experience">
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="expert">Expert</option>
            </select>
            <div>
                <button type="button">Previous</button>
                <button type="submit">Next</button>
            </div>
        </form>
    </div>
</body>
</html>
