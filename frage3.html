<script>
    function toggleTextarea() {
        const progJa = document.getElementById('prog_ja').checked;
        const textarea = document.getElementById('prog_details');

        if (progJa) {
            textarea.classList.add('show');
        } else {
            textarea.classList.remove('show');
        }
    }

    function goBack() {
        saveAnswers();
        window.location.href = 'frage2.html';
    }

    function saveAnswers() {
        let progExp = '';
        const progRadios = document.getElementsByName('programmiererfahrung');
        for (let i = 0; i < progRadios.length; i++) {
            if (progRadios[i].checked) {
                progExp = progRadios[i].value;
            }
        }

        let github = '';
        const githubRadios = document.getElementsByName('github_account');
        for (let i = 0; i < githubRadios.length; i++) {
            if (githubRadios[i].checked) {
                github = githubRadios[i].value;
            }
        }

        const progDetails = document.getElementById('prog_details').value;

        localStorage.setItem('programmiererfahrung', progExp);
        localStorage.setItem('programmiererfahrung_details', progDetails);
        localStorage.setItem('github_account', github);
    }

    function saveAndSubmit() {
        let progExp = '';
        const progRadios = document.getElementsByName('programmiererfahrung');
        for (let i = 0; i < progRadios.length; i++) {
            if (progRadios[i].checked) {
                progExp = progRadios[i].value;
            }
        }

        let github = '';
        const githubRadios = document.getElementsByName('github_account');
        for (let i = 0; i < githubRadios.length; i++) {
            if (githubRadios[i].checked) {
                github = githubRadios[i].value;
            }
        }

        const details = document.getElementById('prog_details').value;

        if (!progExp) {
            alert('Bitte wähle aus, ob du Programmiererfahrung hast');
            return;
        }

        if (progExp === 'ja' && !details.trim()) {
            alert('Bitte beschreibe deine Programmiererfahrung');
            return;
        }

        if (!github) {
            alert('Bitte wähle aus, ob du einen GitHub Account hast');
            return;
        }

        saveAnswers();
        window.location.href = 'ergebnis.html';
    }

    // 🔁 Wiederherstellung beim Laden (OHNE moderne Syntax)
    window.onload = function () {
        const savedProgExp = localStorage.getItem('programmiererfahrung');
        if (savedProgExp) {
            const radios = document.getElementsByName('programmiererfahrung');
            for (let i = 0; i < radios.length; i++) {
                if (radios[i].value === savedProgExp) {
                    radios[i].checked = true;
                }
            }
        }

        const savedDetails = localStorage.getItem('programmiererfahrung_details');
        if (savedDetails) {
            document.getElementById('prog_details').value = savedDetails;
        }

        const savedGithub = localStorage.getItem('github_account');
        if (savedGithub) {
            const radios = document.getElementsByName('github_account');
            for (let i = 0; i < radios.length; i++) {
                if (radios[i].value === savedGithub) {
                    radios[i].checked = true;
                }
            }
        }

        toggleTextarea();
    };
</script>
