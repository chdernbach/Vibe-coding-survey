<script>
window.onload = function () {

    // Wiederherstellen
    var progExp = localStorage.getItem('programmiererfahrung');
    if (progExp) {
        var radios = document.getElementsByName('programmiererfahrung');
        for (var i = 0; i < radios.length; i++) {
            if (radios[i].value === progExp) {
                radios[i].checked = true;
            }
        }
    }

    var details = localStorage.getItem('programmiererfahrung_details');
    if (details) {
        document.getElementById('prog_details').value = details;
    }

    var github = localStorage.getItem('github_account');
    if (github) {
        var radios2 = document.getElementsByName('github_account');
        for (var j = 0; j < radios2.length; j++) {
            if (radios2[j].value === github) {
                radios2[j].checked = true;
            }
        }
    }

    toggleTextarea();
};

function toggleTextarea() {
    var textarea = document.getElementById('prog_details');
    var progJa = document.getElementById('prog_ja').checked;

    if (progJa) {
        textarea.classList.add('show');
    } else {
        textarea.classList.remove('show');
    }
}

function saveAnswers() {
    var progExp = '';
    var radios = document.getElementsByName('programmiererfahrung');
    for (var i = 0; i < radios.length; i++) {
        if (radios[i].checked) progExp = radios[i].value;
    }

    var github = '';
    var radios2 = document.getElementsByName('github_account');
    for (var j = 0; j < radios2.length; j++) {
        if (radios2[j].checked) github = radios2[j].value;
    }

    localStorage.setItem('programmiererfahrung', progExp);
    localStorage.setItem('programmiererfahrung_details',
        document.getElementById('prog_details').value
    );
    localStorage.setItem('github_account', github);
}

function goBack() {
    saveAnswers();
    window.location.href = 'frage2.html';
}

function saveAndSubmit() {
    saveAnswers();
    window.location.href = 'ergebnis.html';
}
</script>
