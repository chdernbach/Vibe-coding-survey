<script>
    const STORAGE = {
        progExp: 'frage3_programmiererfahrung',
        progDetails: 'frage3_programmiererfahrung_details',
        github: 'frage3_github_account'
    };

    document.addEventListener('DOMContentLoaded', () => {

        // Programmiererfahrung
        const progExp = sessionStorage.getItem(STORAGE.progExp);
        if (progExp) {
            const radio = document.querySelector(
                `input[name="programmiererfahrung"][value="${progExp}"]`
            );
            if (radio) radio.checked = true;
        }

        // Details
        const details = sessionStorage.getItem(STORAGE.progDetails);
        if (details) {
            document.getElementById('prog_details').value = details;
        }

        // GitHub
        const github = sessionStorage.getItem(STORAGE.github);
        if (github) {
            const radio = document.querySelector(
                `input[name="github_account"][value="${github}"]`
            );
            if (radio) radio.checked = true;
        }

        toggleTextarea();

        // Auto-Speichern
        document.querySelectorAll('input, textarea').forEach(el => {
            el.addEventListener('change', saveAnswers);
            el.addEventListener('input', saveAnswers);
        });
    });

    function toggleTextarea() {
        const progJa = document.getElementById('prog_ja').checked;
        const textarea = document.getElementById('prog_details');

        textarea.classList.toggle('show', progJa);
    }

    function saveAnswers() {
        const progExp = document.querySelector('input[name="programmiererfahrung"]:checked')?.value;
        const progDetails = document.getElementById('prog_details').value;
        const github = document.querySelector('input[name="github_account"]:checked')?.value;

        if (progExp) sessionStorage.setItem(STORAGE.progExp, progExp);
        sessionStorage.setItem(STORAGE.progDetails, progDetails || '');
        if (github) sessionStorage.setItem(STORAGE.github, github);
    }

    function goBack() {
        saveAnswers();
        window.location.href = 'frage2.html';
    }

    function saveAndSubmit() {
        const progExp = document.querySelector('input[name="programmiererfahrung"]:checked')?.value;
        const github = document.querySelector('input[name="github_account"]:checked')?.value;
        const details = document.getElementById('prog_details').value;

        if (!progExp) {
            alert('Bitte wähle aus, ob du Programmiererfahrung hast');
            return;
        }

        if (progExp === 'ja' && !details.trim()) {
            alert('Bitte beschreibe deine Programmiererfahrung');
            return;
        }

        if (!github) {
            alert('Bitte wähle aus, ob du einen GitHub Account hast');
            return;
        }

        saveAnswers();
        window.location.href = 'ergebnis.html';
    }
</script>
