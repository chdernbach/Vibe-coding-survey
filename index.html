<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Vibe Coding Survey</title>
    <style>
        /* CSS from frage1.html */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .progress {
            background-color: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
            height: 20px;
            width: 100%;
        }
        .progress-bar {
            background-color: #76c7c0;
            height: 100%;
            width: 0%;
        }
        .button-group {
            margin-top: 20px;
        }
        .btn {
            padding: 10px 20px;
            background-color: #007bff;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Willkommen zur Vibe Coding Umfrage</h1>
        <div class="progress">
            <div class="progress-bar" style="width: 0;"></div>
        </div>
        <div class="button-group">
            <button class="btn">Umfrage starten</button>
        </div>
    </div>
</body>
</html>
