<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Coding Survey - Frage 2</title>
    <script>
        function saveToLocalStorage() {
            const answer = document.getElementById('kiEinsatz').value;
            localStorage.setItem('kiEinsatz', answer);
            window.location.href = 'frage3.html';
        }
    </script>
</head>
<body>
    <h1>Frage 2</h1>
    <form onsubmit="event.preventDefault(); saveToLocalStorage();">
        <label for="kiEinsatz">In welcher Form setzt du KI bereits heute ein in deinem Arbeitsalltag?</label><br>
        <textarea id="kiEinsatz" name="kiEinsatz" rows="4" cols="50" required></textarea><br><br>
        <input type="submit" value="Weiter">
    </form>
</body>
</html>
