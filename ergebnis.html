<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Coding Survey</title>
    <script>
        async function sendData() {
            const data = {
                vibeCoding: document.getElementById('vibeCoding').value,
                kiEinsatz: document.getElementById('kiEinsatz').value,
                frage3: document.getElementById('frage3').value,
                programmiererfahrung: document.getElementById('programmiererfahrung').value,
                programmiererfahrungDetails: document.getElementById('programmiererfahrungDetails').value,
                githubAccount: document.getElementById('githubAccount').value
            };

            const response = await fetch('https://script.google.com/macros/s/AKfycbxpPX-5ZZPOIhqwvf1iFynpCMQrk2VZcaH8fmPSbX9n_pTwTZI2QRf-kk9sXsIXPfMDCg/exec', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                console.log('Data sent successfully!');
            } else {
                console.error('Failed to send data.');
            }
        }

        function startRedirect() {
            let countdown = 5;
            const countdownDisplay = document.getElementById('countdown');
            countdownDisplay.innerText = countdown;
            const interval = setInterval(() => {
                countdown--;
                countdownDisplay.innerText = countdown;
                if (countdown <= 0) {
                    clearInterval(interval);
                    window.location.href = 'https://switzerland.com';
                }
            }, 1000);
        }

        window.onload = startRedirect;
    </script>
</head>
<body>
    <h1>Vibe Coding Survey</h1>
    <form onsubmit="sendData(); return false;">
        <label for="vibeCoding">Vibe Coding:</label>
        <input type="text" id="vibeCoding" required><br><br>
        <label for="kiEinsatz">KI Einsatz:</label>
        <input type="text" id="kiEinsatz" required><br><br>
        <label for="frage3">Frage 3:</label>
        <input type="text" id="frage3" required><br><br>
        <label for="programmiererfahrung">Programmierererfahrung:</label>
        <input type="text" id="programmiererfahrung" required><br><br>
        <label for="programmiererfahrungDetails">Programmierererfahrung Details:</label>
        <input type="text" id="programmiererfahrungDetails" required><br><br>
        <label for="githubAccount">GitHub Account:</label>
        <input type="text" id="githubAccount" required><br><br>
        <input type="submit" value="Submit">
    </form>
    <p>Redirecting in <span id="countdown">5</span> seconds...</p>
</body>
</html>
